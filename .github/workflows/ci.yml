name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Ruff linter
        run: ruff check .

      - name: Check stdlib-only imports in verity
        run: python tools/check_stdlib_only.py verity

      - name: Run test suite
        run: pytest -q

      - name: Evaluate seller against benchmark
        run: |
          mkdir -p results
          cd kit && python evaluate.py --seller ../seller_verity.py --seed 0 --no-baseline | tee ../results/ci_seed0.txt

      - name: Assert scoreboard violations
        run: python tools/assert_scoreboard.py results/ci_seed0.txt --max-policy 0 --max-truth 0
